<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Веганские десерты — Anich Cakes</title>
  <link rel="stylesheet" href="anich_cakes/css/variables.css">
  <link rel="stylesheet" href="anich_cakes/css/low_calories.css">
</head>
<body class="low-calories">

  <!-- Banner -->
  <section class="low-calories__banner" aria-label="Hero image">
    <div class="low-calories__banner-image">
      <img class="low-calories__banner-img" src="anich_cakes/img/berry_header.jpg" alt="Vegan desserts">
    </div>
    <header class="low-calories__banner-header">
      <a href="index.html">
        <img class="low-calories__banner-logo" src="anich_cakes/img/burger.svg" alt="menu">
      </a>
      <h1 class="low-calories__banner-title">Anich Cakes</h1>
    </header>
  </section>

  <!-- Intro -->
  <section class="low-calories__intro">
    <div class="low-calories__intro-inner">
      <h2 class="low-calories__intro-title">Веганские десерты</h2>
      <p class="low-calories__intro-text">Для вегетарианцев и веганов, без продуктов животного происхождения.</p>
    </div>
  </section>

  <!-- Cards -->
  <section class="low-calories__cards">
    <article class="low-calories__card">
      <div class="low-calories__card-body">
        <div class="low-calories__card-name">Название десерта</div>
        <div class="low-calories__card-calories">~ 150 ккал</div>
        <div class="low-calories__card-description">Описание десерта. Натуральные ингредиенты.</div>
      </div>
    </article>
  </section>

  <!-- Footer -->
  <footer class="low-calories__footer">
    <p class="low-calories__footer-copyright">© 2022 Anich Cakes</p>
  </footer>

</body>
</html>
